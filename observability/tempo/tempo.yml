server:
    http_listen_port: 3200
    log_level: info

distributor:
    receivers:
        otlp:
            protocols:
                grpc: {}
                http: {}

storage:
    trace:
        backend: local
        wal:
            path: /tmp/tempo/wal
        local:
            path: /tmp/tempo/traces

compactor:
    compaction:
        block_retention: 48h

metrics_generator:
    storage:
        path: /tmp/tempo/generator
        remote_write:
            - url: http://prometheus:9090/api/v1/write
              send_exemplars: true

overrides:
    metrics_generator_processors: [service-graphs, span-metrics]
