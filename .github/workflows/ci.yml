name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Create static directory for tests
              run: mkdir -p static

            - name: Run tests
              env:
                  TEST_DATABASE_URL: "sqlite:///./test.db"
                  TEST_SECRET_KEY: "github-actions-test-key-beetrack-long-enough-for-tests"
                  ENABLE_SCHEDULER: "false"
                  METRICS_ENABLED: "false"
                  DETAILED_LOGGING_ENABLED: "false"
                  CORRELATION_IDS_ENABLED: "false"
                  PYTHONPATH: "."
              run: |
                  pytest --cov=app

    frontend-checks:
        name: Frontend Lint & Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: ./frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci --legacy-peer-deps

            - name: Run linter
              working-directory: ./frontend
              run: npm run lint

            - name: Run tests
              working-directory: ./frontend
              run: npm test

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build

    smoke-compose:
        name: Docker Compose Smoke
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - name: Set up env files
              run: |
                  cat > .env << 'EOF'
                  DATABASE_URL=postgresql+psycopg2://beetadmin:securepassword123@db:5432/beetrack
                  SECRET_KEY=1b6f6a38d0e04c88b82a16fb2b9f9e513c0f0c7b0a6d5c8e3a02f1e4c6d7a8b9
                  RATE_LIMIT_STORAGE=redis
                  REDIS_URL=redis://redis:6379/0
                  DETAILED_LOGGING_ENABLED=true
                  PROMETHEUS_ENDPOINT_ENABLED=true
                  EOF

                  cat > .env.db << 'EOF'
                  POSTGRES_DB=beetrack
                  POSTGRES_USER=beetadmin
                  POSTGRES_PASSWORD=securepassword123
                  EOF

            - name: Build and start core services
              run: |
                  docker compose version
                  docker compose up -d --build db redis api

            - name: Wait for API readiness
              run: |
                  for i in {1..60}; do
                    if curl -fsS http://localhost:8000/healthz >/dev/null; then
                      echo "API is ready"; exit 0; fi; sleep 2; done; exit 1

            - name: Check /metrics endpoint
              run: |
                  curl -fsS http://localhost:8000/metrics | head -n 50

            - name: Dump container logs on failure
              if: failure()
              run: |
                  docker compose ps
                  docker compose logs --no-color api | tail -n 200
                  docker compose logs --no-color db | tail -n 100
                  docker compose logs --no-color redis | tail -n 100

            - name: Teardown
              if: always()
              run: |
                  docker compose down -v
