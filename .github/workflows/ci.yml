name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Create static directory for tests
              run: mkdir -p static

            - name: Run tests
              env:
                  TEST_DATABASE_URL: "sqlite:///./test.db"
                  TEST_SECRET_KEY: "github-actions-test-key-beetrack-long-enough-for-tests"
                  ENABLE_SCHEDULER: "false"
                  METRICS_ENABLED: "false"
                  DETAILED_LOGGING_ENABLED: "false"
                  CORRELATION_IDS_ENABLED: "false"
              run: |
                  pytest --cov=app

    frontend-checks:
        name: Frontend Lint & Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: ./frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci --legacy-peer-deps

            - name: Run linter
              working-directory: ./frontend
              run: npm run lint

            - name: Run tests
              working-directory: ./frontend
              run: npm test

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build
