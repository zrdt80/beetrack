services:
    db:
        image: postgres:15
        restart: unless-stopped
        environment:
            - TZ=UTC
        env_file:
            - .env.db
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - beetrack-net

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - beetrack-net

    api:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            - TZ=UTC
            - RATE_LIMIT_STORAGE=redis
            - REDIS_URL=redis://redis:6379/0
        env_file:
            - .env
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy
        ports:
            - "8000:8000"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0)",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
        networks:
            - beetrack-net

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "3000:80"
        depends_on:
            - api
        networks:
            - beetrack-net

    prometheus:
        image: prom/prometheus:v3.6.0
        restart: unless-stopped
        profiles: [observability]
        command:
            - --config.file=/etc/prometheus/prometheus.yml
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
        ports:
            - "9090:9090"
        depends_on:
            api:
                condition: service_started
        networks:
            - beetrack-net

    grafana:
        image: grafana/grafana:12.3.0-18392635519-ubuntu
        restart: unless-stopped
        profiles: [observability]
        environment:
            - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
            - GF_USERS_DEFAULT_THEME=light
        volumes:
            - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
            - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
        ports:
            - "3001:3000"
        depends_on:
            prometheus:
                condition: service_started
        networks:
            - beetrack-net

    tempo:
        image: grafana/tempo:2.6.0
        restart: unless-stopped
        profiles: [observability]
        command: ["-config.file=/etc/tempo.yml"]
        volumes:
            - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
        ports:
            - "4317:4317"
        networks:
            - beetrack-net

    node_exporter:
        image: prom/node-exporter:v1.8.1
        restart: unless-stopped
        profiles: [observability]
        ports:
            - "9100:9100"
        networks:
            - beetrack-net

    redis_exporter:
        image: oliver006/redis_exporter:v1.78.0
        restart: unless-stopped
        profiles: [observability]
        environment:
            - REDIS_ADDR=redis://redis:6379
        depends_on:
            redis:
                condition: service_healthy
        ports:
            - "9121:9121"
        networks:
            - beetrack-net

volumes:
    pgdata:

networks:
    beetrack-net:
