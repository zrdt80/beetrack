services:
    db:
        image: postgres:15
        restart: unless-stopped
        environment:
            - TZ=UTC
        env_file:
            - .env.db
        volumes:
            - pgdata:/var/lib/postgresql/data
        networks:
            - beetrack-net

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - beetrack-net

    api:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            - TZ=UTC
            - RATE_LIMIT_STORAGE=redis
            - REDIS_URL=redis://redis:6379/0
        env_file:
            - .env
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy
        ports:
            - "8000:8000"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3); sys.exit(0)",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
        networks:
            - beetrack-net

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "3000:80"
        depends_on:
            - api
        networks:
            - beetrack-net

volumes:
    pgdata:

networks:
    beetrack-net:
